name: Staging deploy

on:
  push:
    branches: [develop]

permissions:
  contents: write
  actions: read
  packages: write
  id-token: write
  attestations: write

jobs:
  tag:
    uses: skni-kod/skni-platform-workflows/.github/workflows/create-date-tag.yaml@main
    with:
      commit_id: ${{ github.sha }}

  build:
    needs: tag
    uses: skni-kod/skni-platform-workflows/.github/workflows/docker-build.yaml@main
    with:
      commit_id: ${{ github.sha }}
      image_name: ${{ github.event.repository.name }}
      tag: ${{ needs.tag.outputs.version }}

  deploy:
    needs: build
    environment: staging
    runs-on: self-hosted
    steps:
      - name: Staging deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/docker_project/sknibot_staging

            docker compose --file docker-compose.stag.yml pull && docker compose --file docker-compose.stag.yml up -d
            docker system prune -a -f
